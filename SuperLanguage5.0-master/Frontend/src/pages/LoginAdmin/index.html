<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LingoAdmin - Language Learning Admin Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../css/Admin/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="../../types/admin/main.ts"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col md:flex-row">
<!-- ==================== SECTION 1: AUTHENTICATION (LOGIN / REGISTER) ==================== -->
  <div id="authSection" class="fixed inset-0 z-50 bg-slate-900 flex items-center justify-center p-4 overflow-y-auto">
    <!-- Background Design Elements -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
      <div class="absolute -top-40 -right-40 w-96 h-96 bg-indigo-600/30 rounded-full blur-3xl"></div>
      <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-purple-600/30 rounded-full blur-3xl"></div>
    </div>

    <!-- Auth Card -->
    <div class="relative bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-100 my-auto">
      
      <!-- Card Header -->
      <div class="bg-linear-to-r from-indigo-600 to-indigo-700 p-8 text-white text-center relative">
        <div class="w-14 h-14 bg-white/10 backdrop-blur-md rounded-2xl flex items-center justify-center text-3xl mx-auto mb-3 shadow-inner">
          <i class="fas fa-language"></i>
        </div>
        <h2 class="text-2xl font-bold tracking-tight" id="authTitle">LingoAdmin Portal</h2>
        <p class="text-xs text-indigo-100 mt-1" id="authSubTitle">Hệ thống quản lý nền tảng học ngoại ngữ</p>
      </div>

      <!-- LOGIN FORM -->
      <div id="loginFormContainer" class="p-8 space-y-5">
        <form id="loginForm" class="space-y-4">
          <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Email / Tên đăng nhập</label>
            <div class="relative">
              <i class="fas fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
              <input type="email" id="loginEmail" autocomplete="username" required placeholder="admin@example.com" class="w-full bg-slate-50 border border-slate-200 pl-10 pr-4 py-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Mật khẩu</label>
            <div class="relative">
              <i class="fas fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
              <input type="password" id="loginPassword" autocomplete="current-password" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 pl-10 pr-4 py-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
            </div>
          </div>

          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl text-sm shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center">
            <span>Đăng Nhập Dashboard</span>
            <i class="fas fa-arrow-right ml-2"></i>
          </button>
        </form>
      </div>
</body>
</html>
